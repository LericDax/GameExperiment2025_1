<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procedural Block World</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background: #000;
        font-family: "Segoe UI", sans-serif;
        color: #fff;
      }

      #underwater-overlay {
        --underwater-overlay-tint: rgba(16, 68, 128, 0.48);
        --underwater-overlay-highlight: rgba(72, 172, 255, 0.22);
        --underwater-bubble-color: rgba(255, 255, 255, 0.3);
        --underwater-bubble-size: 80px;
        position: fixed;
        inset: 0;
        z-index: 80;
        pointer-events: none;
        opacity: 0;
        transform: translateZ(0);
        transition: opacity 0.4s ease, filter 0.6s ease;
        filter: saturate(100%);
      }

      #underwater-overlay::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
            180deg,
            var(--underwater-overlay-highlight) 0%,
            transparent 35%
          ),
          linear-gradient(
            180deg,
            transparent 0%,
            var(--underwater-overlay-tint) 100%
          );
        backdrop-filter: saturate(140%) blur(3px);
      }

      #underwater-overlay::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
            circle at 20% 20%,
            rgba(255, 255, 255, 0.12),
            transparent 45%
          ),
          radial-gradient(
            circle at 80% 40%,
            rgba(255, 255, 255, 0.08),
            transparent 55%
          );
        mix-blend-mode: screen;
        opacity: 0.6;
      }

      #underwater-overlay.visible {
        opacity: 1;
        filter: saturate(140%);
      }

      #underwater-overlay .bubble {
        position: absolute;
        bottom: calc(-1 * var(--underwater-bubble-size));
        left: var(--bubble-left, 50%);
        width: calc(
          var(--underwater-bubble-size) * var(--bubble-scale, 1)
        );
        height: calc(
          var(--underwater-bubble-size) * var(--bubble-scale, 1)
        );
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.55) 0%,
          var(--underwater-bubble-color) 45%,
          rgba(255, 255, 255, 0.08) 70%,
          transparent 100%
        );
        opacity: 0;
        transform: translate(-50%, 0) scale(var(--bubble-scale, 1));
        animation: bubbleRise var(--bubble-duration, 12s) linear infinite;
        animation-delay: var(--bubble-delay, 0s);
        animation-play-state: paused;
      }

      #underwater-overlay.visible .bubble {
        animation-play-state: running;
      }

      @keyframes bubbleRise {
        0% {
          transform: translate(-50%, 0) scale(var(--bubble-scale, 1));
          opacity: 0;
        }

        10% {
          opacity: 0.55;
        }

        40% {
          opacity: 0.8;
        }

        100% {
          transform: translate(-50%, -110vh) scale(calc(var(--bubble-scale, 1) * 1.1));
          opacity: 0;
        }
      }

      /*
        Weather overlay variables updated by the weather overlay controller:
          --rain-intensity: overall strength of the effect (0 hides the overlay).
          --rain-wind: horizontal drift multiplier applied to the streak animation.
          --rain-velocity: fall-speed multiplier applied to each raindrop animation.
          --rain-density: opacity multiplier for individual streaks.
      */
      #weather-overlay {
        --rain-intensity: 0;
        --rain-wind: 0;
        --rain-velocity: 1;
        --rain-density: 0;
        position: fixed;
        inset: 0;
        z-index: 80;
        pointer-events: none;
        overflow: hidden;
        opacity: clamp(0, var(--rain-intensity, 0), 1);
        transition: opacity 0.35s ease, filter 0.6s ease;
        filter: saturate(120%);
        mix-blend-mode: screen;
        transform: translateZ(0);
        will-change: opacity;
      }

      #weather-overlay::before {
        content: "";
        position: absolute;
        inset: -10%;
        background: radial-gradient(
            circle at 30% 20%,
            rgba(180, 210, 255, 0.35),
            transparent 45%
          ),
          radial-gradient(
            circle at 70% 30%,
            rgba(120, 180, 255, 0.22),
            transparent 60%
          ),
          linear-gradient(180deg, rgba(20, 52, 92, 0.35), transparent 60%);
        opacity: calc(clamp(0, var(--rain-intensity, 0), 1) * 0.55);
        pointer-events: none;
      }

      #weather-overlay::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.18) 0%,
          rgba(120, 160, 210, 0.08) 35%,
          transparent 100%
        );
        mix-blend-mode: overlay;
        opacity: calc(clamp(0, var(--rain-intensity, 0), 1) * 0.32);
        pointer-events: none;
      }

      #weather-overlay .raindrop {
        position: absolute;
        top: -120vh;
        left: var(--raindrop-left, 50%);
        width: 2px;
        height: calc(70vh * var(--raindrop-scale, 1));
        background: linear-gradient(
          to bottom,
          rgba(220, 235, 255, 0) 0%,
          rgba(220, 235, 255, 0.75) 45%,
          rgba(120, 165, 220, 0.35) 80%,
          rgba(120, 165, 220, 0) 100%
        );
        opacity: calc(clamp(0, var(--rain-density, 0), 1) * 0.9);
        transform: translate3d(0, 0, 0);
        animation-name: rainStreakFall;
        animation-duration: calc(
          var(--raindrop-duration, 1.4s) / max(var(--rain-velocity, 1), 0.2)
        );
        animation-timing-function: linear;
        animation-delay: var(--raindrop-delay, 0s);
        animation-iteration-count: infinite;
        animation-play-state: paused;
      }

      #weather-overlay:not([hidden]) .raindrop {
        animation-play-state: running;
      }

      #weather-overlay .raindrop::after {
        content: "";
        position: absolute;
        inset: -120% -160% 40% -160%;
        background: radial-gradient(
          circle,
          rgba(220, 235, 255, 0.4) 0%,
          rgba(220, 235, 255, 0) 65%
        );
        opacity: calc(clamp(0, var(--rain-density, 0), 1) * 0.35);
        filter: blur(10px);
      }

      @keyframes rainStreakFall {
        0% {
          transform: translate3d(
            calc(var(--rain-wind, 0) * -18px),
            -120vh,
            0
          );
          opacity: 0;
        }

        12% {
          opacity: calc(0.4 + clamp(0, var(--rain-intensity, 0), 1) * 0.5);
        }

        55% {
          opacity: calc(0.8 + clamp(0, var(--rain-intensity, 0), 1) * 0.2);
        }

        100% {
          transform: translate3d(
            calc(var(--rain-wind, 0) * 22px),
            120vh,
            0
          );
          opacity: 0;
        }
      }

      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: rgba(0, 0, 0, 0.6);
        cursor: pointer;
        transition: opacity 0.3s ease;
      }

      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #instructions {
        text-align: center;
        max-width: 420px;
        line-height: 1.6;
      }

      #overlay-status {
        margin-top: 18px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.85);
        line-height: 1.5;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      #overlay-status.visible {
        opacity: 1;
      }

      #overlay-status.error {
        color: #ffb4a2;
      }

      #hud {
        position: absolute;
        left: 24px;
        bottom: 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
        min-width: 220px;
        font-size: 14px;
        z-index: 110;
      }

      .hud-bar {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .hud-label {
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.8);
      }

      .hud-track {
        flex: 1;
        height: 6px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        overflow: hidden;
      }

      .hud-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #6bff8f, #2ec4a0);
        transition: width 0.2s ease;
      }

      #hud-oxygen-fill {
        background: linear-gradient(90deg, #7ecbff, #3a8dff);
      }

      .hud-value {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.9);
        min-width: 32px;
        text-align: right;
      }

      #hud-status {
        min-height: 18px;
        font-size: 13px;
        color: #ffe28a;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      #hud-status.visible {
        opacity: 1;
      }

      #hud-status.error {
        color: #ffb4a2;
      }

      #hud.in-water .hud-fill {
        background: linear-gradient(90deg, #45d0ff, #1b7bff);
      }

      canvas {
        display: block;
      }

      .volume-widget {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 220px;
        padding: 10px 12px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: rgba(12, 16, 24, 0.78);
        border: 1px solid rgba(132, 160, 220, 0.24);
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(5, 8, 14, 0.35);
        color: rgba(236, 242, 255, 0.92);
        backdrop-filter: blur(6px);
        z-index: 120;
        pointer-events: auto;
      }

      .volume-widget.dragging {
        cursor: grabbing;
      }

      .volume-widget-handle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(200, 220, 255, 0.72);
        cursor: grab;
        user-select: none;
      }

      .volume-widget-title {
        font-weight: 600;
        font-size: 11px;
      }

      .volume-widget-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .volume-widget button {
        appearance: none;
        border: 1px solid rgba(140, 168, 232, 0.3);
        background: rgba(18, 24, 36, 0.85);
        color: inherit;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        transition: border-color 160ms ease, background 160ms ease;
      }

      .volume-widget button:hover,
      .volume-widget button:focus-visible {
        border-color: rgba(196, 214, 255, 0.65);
        background: rgba(24, 32, 46, 0.95);
        outline: none;
      }

      .volume-widget button:active {
        background: rgba(16, 22, 34, 0.95);
      }

      .volume-widget-toggle {
        width: 42px;
      }

      .volume-widget-next {
        width: 42px;
      }

      .volume-widget-slider {
        flex: 1;
        accent-color: #94b9ff;
        cursor: pointer;
      }

      .volume-widget-track {
        min-height: 16px;
        font-size: 12px;
        line-height: 1.4;
        color: rgba(214, 228, 255, 0.85);
        text-shadow: 0 1px 1px rgba(2, 4, 8, 0.5);
      }

      .volume-widget-hint {
        font-size: 11px;
        line-height: 1.4;
        color: rgba(255, 190, 140, 0.85);
      }

      .volume-widget-no-select {
        user-select: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="overlay" class="hidden" aria-hidden="true">
        <div id="instructions">
          <h1>Procedural Block World</h1>
          <p>
            Click anywhere to lock the pointer, then use WASD to move, Space to
            jump, and Shift to sprint (or dive while swimming). Keep an eye on
            your health and oxygen in the HUD.
          </p>
          <p id="overlay-status" role="alert" aria-live="assertive"></p>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
